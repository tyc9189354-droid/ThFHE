# ==========================================================
# Threshold FHE 評測實驗配置檔 (Benchmark Configuration)
# ==========================================================

# 評測模式: 'local' (本地演算法評測) 或 'remote' (透過 server.py / 雲端連線)
mode: "local"

# 實驗重複次數與預熱次數
iterations: 5
warmup: 1

# 測試的參數組合 (k: 密文模數 bits, m: 明文模數 bits, b: 門分解 base bits)
test_params:
  - k: 16
    m: 1
    b: 4
  - k: 64
    m: 1
    b: 8

# 要比較的方案清單:
# 可選: 'ccs25' (CCS 2025), 'baseline_noise_flooding' (Noah's Ark), 'pelta' (PELTA), 'hqfs' (HQ-FS Our Work)
schemes:
  - "ccs25"
  - "baseline_noise_flooding"
  - "pelta"
  - "hqfs"

# 雲端伺服器設定 (僅在 mode 為 remote 時使用)
remote_server:
  url: "http://127.0.0.1:8000"

# 結果輸出目錄
output_dir: "./results"
